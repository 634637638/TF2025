# TF2025 前端 Nginx 配置
# 站点: v6.cn9527.cn:33336
# HSTS 仅在 HTTPS 响应上由浏览器采纳；TLS 应在此 Nginx 或可信入口终止。

# 开启 Gzip 压缩（优化加载速度）
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
gzip_disable "msie6";
gzip_proxied any;

server {
    listen 33336;
    server_name v6.cn9527.cn;

    # 网站根目录
    root /www/wwwroot/v6.cn9527.cn;
    index index.html;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 带 hash 的静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|pdf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # HTML 入口不缓存，避免 Safari 固定旧入口 hash
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://map.qq.com https://*.map.qq.com https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.bootcdn.net; connect-src 'self' https://api.iconify.design https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.qq.com https://api.cn9527.cn https://v4.cn9527.cn; media-src 'self' blob: https:; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /index.html =404;
    }

    # SPA 路由支持
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://map.qq.com https://*.map.qq.com https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.bootcdn.net; connect-src 'self' https://api.iconify.design https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.qq.com https://api.cn9527.cn https://v4.cn9527.cn; media-src 'self' blob: https:; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }

# API 反向代理到家庭后端 DDNS（Node.js 直接监听 3000）
# 同机部署时改为 http://127.0.0.1:3000/api/；P2P 可达时可改为 http://10.2.3.10:3000/api/
    location /api/ {
        proxy_pass http://v4.cn9527.cn:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;

        # 超时设置（文件上传需要更长时间）
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 支持文件上传
        client_max_body_size 10M;
    }

    # 上传文件访问（代理到家庭后端 DDNS）
    # 同机部署时改为 http://127.0.0.1:3000/uploads/；P2P 可达时可改为 http://10.2.3.10:3000/uploads/
    location /uploads/ {
        proxy_pass http://v4.cn9527.cn:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 缓存设置
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 上传媒体用于页面内联预览，避免代理层把视频标记为附件下载。
        proxy_hide_header Content-Disposition;
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # 错误页面
    error_page 404 /index.html;

    # 日志
    access_log /www/wwwlogs/v6.cn9527.cn.log;
    error_log /www/wwwlogs/v6.cn9527.cn.error.log;
}
