# TF2025 后端 Nginx 配置
# 可选：仅在需要单独的后端 Nginx 入口时使用；当前主链路由前端 Nginx 直连 Node 3000，不启用此 3001 层。
# 站点: api.cn9527.cn:3001
# Node.js 应用监听 3000，Nginx 对外监听 3001。
# 此文件应由 Nginx 的 http {} 块 include，以便定义限流共享区。
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 3001;
    server_name api.cn9527.cn;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 反向代理到 Node.js 应用
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # API 限流
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;

    }

    # 文件上传
    location /api/upload {
        client_max_body_size 10M;
        proxy_pass http://127.0.0.1:3000;
    }

    # 健康检查
    location /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # 日志
    access_log /www/wwwlogs/api.cn9527.cn.log;
    error_log /www/wwwlogs/api.cn9527.cn.error.log;
}
