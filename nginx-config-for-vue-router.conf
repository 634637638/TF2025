server {
    listen 33336;
    server_name v6.cn9527.cn;
    # HSTS 仅在 HTTPS 响应上由浏览器采纳；TLS 应在此 Nginx 或可信入口终止。
    root /www/wwwroot/v6.cn9527.cn;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 带 hash 的静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm|pdf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # HTML 入口不缓存，避免浏览器继续使用旧入口 hash
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://map.qq.com https://*.map.qq.com https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.bootcdn.net; connect-src 'self' https://api.iconify.design https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.qq.com https://api.cn9527.cn https://v4.cn9527.cn; media-src 'self' blob: https:; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files /index.html =404;
    }

    # 关键配置：处理 Vue Router 的 history 模式
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://map.qq.com https://*.map.qq.com https://code.iconify.design; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.bootcdn.net; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.bootcdn.net; connect-src 'self' https://api.iconify.design https://api.open-meteo.com https://geocoding-api.open-meteo.com https://*.qq.com https://api.cn9527.cn https://v4.cn9527.cn; media-src 'self' blob: https:; worker-src 'self' blob:; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri $uri/ /index.html;
    }

    # API 代理到家庭后端 DDNS（Node.js 直接监听 3000）
    # 同机部署时改为 http://127.0.0.1:3000；P2P 可达时可改为 http://10.2.3.10:3000
    location /api/ {
        proxy_pass http://v4.cn9527.cn:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 安全设置
    location ~ /\. {
        deny all;
    }

    # 禁止访问敏感文件
    location ~* \.(env|log|conf)$ {
        deny all;
    }
}
