name: Dependency audit

on:
  pull_request:
  schedule:
    # 每周一北京时间 10:00；使用默认分支的锁文件。
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            directory: .
          - name: frontend
            directory: frontend
          - name: backend
            directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit locked dependencies
        working-directory: ${{ matrix.directory }}
        # 只检查锁文件，不安装依赖、不执行仓库脚本；保留 npm 非零退出码。
        run: npm audit --package-lock-only --audit-level=high --json > dependency-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ matrix.name }}
          path: ${{ matrix.directory }}/dependency-audit.json
          if-no-files-found: error
          retention-days: 7
